services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Separate instance for store tests. tmpfs keeps it fast and disposable:
  # data is gone on every restart, which is what tests want.
  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
      POSTGRES_DB: pantry_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantry -d pantry_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
