openapi: 3.0.3
info:
  title: Pantry API
  version: 0.1.0
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database connectivity
      responses:
        "200":
          description: API is up and the database answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
